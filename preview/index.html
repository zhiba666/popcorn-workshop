<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ecdf">
  <title>爆米花工坊 · 预览首页</title>
  <link rel="stylesheet" href="/preview/styles.css">
</head>
<body>
  <main class="preview-home">
    <header class="home-header">
      <span class="brand">爆米花工坊</span>
      <h1>预览首页</h1>
      <p>试玩游戏，或看看棋盘、机器和工厂的效果。</p>
    </header>

    <nav class="preview-grid" aria-label="选择预览页面">
      <a class="preview-card game-card" href="/preview/game-preview/index.html">
        <span class="card-top"><span class="card-number">01</span><span class="card-label">玩游戏</span></span>
        <span class="card-title">游戏试玩</span>
        <span class="card-description">体验当前游戏，检查生产、合成和订单交付，继续已有的试玩进度。</span>
        <span class="card-action">开始试玩 <span aria-hidden="true">↗</span></span>
      </a>

      <a class="preview-card" href="/preview/game-preview/board.html">
        <span class="card-top"><span class="card-number">02</span><span class="card-label">看界面</span></span>
        <span class="card-title">棋盘展示</span>
        <span class="card-description">查看六种产品和发射器，比较不同等级的外观、大小与摆放。</span>
        <span class="card-action">打开棋盘 <span aria-hidden="true">↗</span></span>
      </a>

      <a class="preview-card" href="/preview/equipment-preview/index.html">
        <span class="card-top"><span class="card-number">03</span><span class="card-label">看动画</span></span>
        <span class="card-title">机器动画</span>
        <span class="card-description">单独查看六台机器，观察运转、加工和出料的动画效果。</span>
        <span class="card-action">查看机器 <span aria-hidden="true">↗</span></span>
      </a>

      <a class="preview-card" href="/preview/factory-preview/index.html">
        <span class="card-top"><span class="card-number">04</span><span class="card-label">看生产</span></span>
        <span class="card-title">工厂生产演示</span>
        <span class="card-description">观察物料从生产、运输到包装入库的过程，检查整座工厂的配合。</span>
        <span class="card-action">进入工厂 <span aria-hidden="true">↗</span></span>
      </a>

      <a class="preview-card" href="/preview/factory-preview/expansion.html">
        <span class="card-top"><span class="card-number">05</span><span class="card-label">看扩建</span></span>
        <span class="card-title">工厂扩建演示</span>
        <span class="card-description">查看 2、6、18 条产线的布局，检查工厂扩建后的设备摆放和连接。</span>
        <span class="card-action">查看扩建 <span aria-hidden="true">↗</span></span>
      </a>
    </nav>
    <footer class="home-footer">选择一个入口，开始查看。</footer>
  </main>
</body>
</html>
